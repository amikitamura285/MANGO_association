name: Crawl MANGO products

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/products.json"
      - "public/products.json"
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run crawl
      - name: Commit updated product data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json public/products.json
          git diff --cached --quiet || git commit -m "chore: update product data"
          git push
